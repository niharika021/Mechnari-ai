# Mechnari.ai base theme.
#
# Only the long-stable [theme] keys are set here (primaryColor,
# background/secondaryBackground, textColor) - these have worked
# unchanged since early Streamlit and drive every native widget
# (buttons, inputs, tabs, sliders, dataframes) consistently, which no
# amount of injected CSS can reach as reliably. Fonts and the deeper
# component chrome (cards, badges, the masthead) are handled in app.py's
# CSS block instead, since Streamlit's newer per-font-face theming keys
# aren't worth pinning the app's startup to before they're verified
# stable across upgrades.
#
# A single committed dark theme, not a light/dark switch: this is an
# enterprise engineering tool typically demoed and used in one context,
# and the "Dark Titanium" identity is Mechnari's own, established
# across every artifact built for this product.

[theme]
base = "dark"
primaryColor = "#3FA895"
backgroundColor = "#0B1210"
secondaryBackgroundColor = "#121C19"
textColor = "#E7EEEC"
